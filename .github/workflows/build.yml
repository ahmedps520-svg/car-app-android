name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CarBrowser-apk
          path: app/build/outputs/apk/release/CarBrowser-release.apk

      - name: Attach APK to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/CarBrowser-release.apk
