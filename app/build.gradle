plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ahmedps520.carbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ahmedps520.carbrowser'
        // Android 4.1+. Car head units like the Rockchip PX3 run Android 4.4 (API 19).
        minSdk 16
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // A fixed key that lives in this repo, so every build (local or CI) can be
    // installed over the previous one. It's only for sideloading; it isn't a secret.
    signingConfigs {
        sideload {
            storeFile file('carbrowser.jks')
            storePassword 'carbrowser'
            keyAlias 'carbrowser'
            keyPassword 'carbrowser'
            enableV1Signing true   // Android 4.x only understands v1 (JAR) signatures
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    base {
        archivesName = 'CarBrowser'
    }
}

dependencies {
    // Modern TLS (TLS 1.2/1.3, current ciphers) for Android 4.x. 2.5.x is the last
    // line that still supports API < 21.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    testImplementation 'junit:junit:4.13.2'
}
